# Test lake -- 1 km fetch, 5 m/s wind.
#
# Expected derived quantities (cookbook "Quick reference -- the test lake"):
#   Hs ~ 0.081 m,  Tp ~ 1.05 s,  lambda_p ~ 1.7 m,  spilling breakers.
# The lake is deep water everywhere except the last few metres.

scene:
  domain: [1000.0, 1000.0]      # m
  water_level: 100.0            # m, z_w
  epsg: 32616

wind:
  speed: 5.0                    # m/s at 10 m reference
  direction: 45.0               # deg CCW from +X, direction blowing TOWARD
  fetch: 1000.0                 # m

spectrum:
  model: jonswap
  gamma: 3.3
  # Cookbook 1.2 prescribes starting with frequency-dependent cos^(2s) and
  # adding Donelan-Banner later behind this flag; the config it ships says
  # "donelan", which is not implemented yet and raises rather than silently
  # falling back.  Named for what is actually running.
  spreading: cos2s
  seed: 20260801

surface:
  tiles:                        # incommensurate sizes, disjoint bands -- see 2.4
    - {size: 64.0, n: 512, band: [0.0, 0.35]}
    - {size: 37.0, n: 256, band: [0.35, 0.7]}
    - {size: 23.0, n: 256, band: [0.7, 1.0]}
  choppiness: 1.0               # physical value; do not tune

bathymetry:                     # the synthetic basin, standing in for PHASE 4
  profile: planar               # planar | embayment
  shoreline: 400.0              # m, y of the waterline; water below, land above
  dean_a: 0.100                 # m^(1/3), medium sand.  Stated explicitly rather
                                # than derived from grain_size so this scene
                                # matches the value the test suite pins.
  max_depth: 5.0                # m
  bank_slope: 0.08
  dx: 1.0                       # m, field grid spacing
  surf_dx: 0.25                 # m, refined spacing through the surf zone --
                                # the surf zone is ~1 m wide, so a 1 m grid
                                # cannot resolve it at all (cookbook 4.4)

nearshore:
  breaker_index: 0.78
  foam_halflife: 3.0            # s
  refraction: true
  shoaling: true

output:
  fps: 30.0
  mesh_dx: 0.125                # m, water mesh post spacing
  lod_rings: [{r: 100.0, dx: 0.125}, {r: 300.0, dx: 0.5}, {r: 1e9, dx: 2.0}]

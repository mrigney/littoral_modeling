# Houdini terrain -- the first scene running on real exported bathymetry.
#
# `bathymetry.source` points at a Phase 4 export, so every synthetic basin key
# is ignored: the export carries its own grid, extent, water level and EPSG.
# Measured from that export by `Bathymetry.summary()`:
#
#   domain      1024 x 1024 m at 1 m posts, origin (-512, -512)
#   water       20.5% of the domain, one connected basin, no islands
#   max depth   23.9 m;  land reaches 75 m above z_w
#   foreshore   0.316 (32%) at 10 cm depth -- steep, and NOT a Dean beach
#
# That last number matters. The synthetic test lake is 6.7% and the cookbook
# assumes ~5%; at 32% the Iribarren number lands in the plunging regime instead
# of spilling, and the surf zone narrows to a few tens of centimetres. Run
# `scripts/run_scene.py` and read summary.md rather than assuming the test
# lake's numbers carry over.
#
# The wind is left at the test lake's 5 m/s so the two scenes differ only in
# their bathymetry. Change it once you want a different sea state.

scene:
  domain: [701.0, 701.0]      # m -- informational here; the export governs
  water_level: 0.95            # m. MUST equal grid_meta.json's z_w, and is
                                # checked on load: a mismatch builds both meshes
                                # at this value while measuring every depth from
                                # the export's, so they agree with each other
                                # and sit at the wrong absolute height.
  epsg: 32616                   # likewise must match the export

wind:
  speed: 16.0                    # m/s at 10 m reference
  direction: 45.0               # deg CCW from +X, direction blowing TOWARD
  fetch: 7000.0                 # m
                                # A closed basin has a direction-dependent
                                # fetch; this is a single representative value.

spectrum:
  model: jonswap
  gamma: 3.3
  spreading: cos2s
  seed: 20260801

surface:
  # Sized for THIS scene's sea, not the test lake's. lambda_p here is 13.6 m
  # against the lake's 1.7 m, and the lake's 64/37/23 m tiles put the first band
  # edge at 16.4 k_p -- so band 1 carried 99.7% of the variance and the other
  # two FFTs bought nothing. Two separate jobs, so two separate rules:
  #
  #   tiles 1-2  set where the bands split. Their Nyquists fix k_ref, and the
  #              first edge is 0.35*k_ref -- aim for 1.5-3 k_p. Here 2.01.
  #   tile 3     sets the top of the resolved range, and therefore where the
  #              mesh/BSDF handoff lands. Left at 23 m so k_max stays 34.97.
  #
  # Sizes stay incommensurate (607/271 = 2.24, 271/23 = 11.8).
  # Result: variance splits 82.5/12.6/4.9 instead of 99.7/0.2/0.1, with Hs,
  # k_max and mss all unchanged to four decimals. It is a redistribution.
  tiles:
    - {size: 607.0, n: 512, band: [0.0, 0.35]}
    - {size: 271.0, n: 256, band: [0.35, 0.7]}
    - {size: 23.0, n: 256, band: [0.7, 1.0]}
  choppiness: 1.0

bathymetry:
  source: straits_crop        # relative to the repository root
  # Everything below is ignored while `source` is set. Left in place so the
  # file still documents what a synthetic fallback would use.
  profile: planar
  shoreline: 400.0
  dean_a: 0.100
  max_depth: 5.0
  dx: 1.0
  surf_dx: 0.25

nearshore:
  breaker_index: 0.78
  foam_halflife: 3.0            # s
  # 'snell' turns the waves AND scales their height by the ray-convergence
  # factor Kr. Kr is derived for straight parallel depth contours and is computed
  # from the direction to the nearest shore, which is discontinuous wherever a
  # different piece of coast becomes nearest -- so on a real coastline it puts
  # hard seams radiating from every concavity. Measured here at 0.25 m: p99.9
  # one-cell jump in amplitude 0.375 under 'snell' vs 0.013 under 'blend'.
  # 'blend' turns the waves but leaves the height alone. Use it until refraction
  # is solved properly; 'snell' is fine on a smooth synthetic beach.
  refraction: blend
  shoaling: true

output:
  fps: 30.0
  mesh_dx: 0.25                 # m -- the export is 1 m, but the mesh samples
                                # it bilinearly and may be finer; 0.25 m keeps a
                                # useful region affordable.
  lod_rings: [{r: 100.0, dx: 0.25}, {r: 300.0, dx: 1.0}, {r: 1e9, dx: 4.0}]

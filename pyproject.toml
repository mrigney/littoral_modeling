[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "littoral-pywave"
version = "0.1.0"
description = "Spectral water surface synthesis for physics-based EO/IR littoral scene generation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "matplotlib>=3.8", "pillow>=10.0"]
# Bundles an ffmpeg binary so `scripts/animate.py` can write MP4 without a
# system install. Optional: without it the script falls back to GIF, which
# works but is several times larger for the same clip.
video = ["imageio-ffmpeg>=0.4"]

[tool.setuptools.packages.find]
include = ["pywave*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gate1: Phase 1 gate checks (spectrum)",
    "gate2: Phase 2 gate checks (FFT surface synthesis)",
    "gate3: Phase 3 gate checks (validation suite / reproducibility)",
    "gate4: Phase 4 gate checks (terrain export loading)",
    "gate5: Phase 5 gate checks (nearshore transformation)",
    "gate6: Phase 6 gate checks (mesh generation and export)",
    "gate5b: Phase 5b gate checks (refraction on a complex coastline)",
    "slow: takes more than a couple of seconds",
]

# Coverage is deliberately NOT in `addopts` above. The full suite runs in about
# 5 min 15 s with `--cov` on, and tracing every line is not free; paying it on
# the single-test runs you do while debugging buys nothing. Ask for it instead:
#     pytest --cov                  # terminal summary
#     pytest --cov --cov-report=html   # then open htmlcov/index.html
# The `source` setting below is what lets `--cov` work with no argument.
[tool.coverage.run]
source = ["pywave"]
# Branch coverage is off on purpose. It is the stricter measure, but turning it
# on redefines the denominator, so the number stops being comparable to the
# 93.5% recorded at v0.1.0. Turn it on with a deliberate re-baseline, not by
# accident.
branch = false

[tool.coverage.report]
precision = 1
exclude_also = [
    # Import-guard fallbacks for the optional extras (matplotlib, pillow,
    # imageio-ffmpeg). Unreachable when the dev extra is installed, which is
    # exactly when coverage runs.
    "except ImportError:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
